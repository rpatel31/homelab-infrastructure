- name: Create Node Exporter Group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    gid: "{{ node_exporter_gid }}"
    system: true
    state: present
  notify: Restart Node Exporter

- name: Create Node Exporter User
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    uid: "{{ node_exporter_uid }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  notify: Restart Node Exporter

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}.tar.gz"
    checksum: "{{ node_exporter_checksum }}"
    mode: "0644" 

- name: Extract Node Exporter 
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}.tar.gz"
    dest: "/opt" 
    remote_src: true
    creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}/node_exporter"

- name: Install Node Exporter Binary
  ansible.builtin.copy:
    src: "/opt/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755" 
    remote_src: true
  notify: Restart Node Exporter

- name: Install Node Exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root 
    mode: "0644"
  notify: Restart Node Exporter


- name: Enable and Start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true 

- name: Check Node Exporter endpoint 
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
    method: GET 
    status_code: 200 
  register: node_exporter_health 
  retries: 5 
  delay: 2 
  until: node_exporter_health.status == 200